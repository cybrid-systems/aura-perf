name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura:0.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Parser, query, proposer, and gate tests
        run: aura test
      - name: Sum-scan example
        run: sh scripts/run-example.sh
        env:
          AURA_EVO_LOG: ${{ github.workspace }}/out/evo.jsonl
      - name: Report mentions a keep and a rollback
        run: |
          grep -q 'KEEP' out/report.txt
          grep -q 'ROLLBACK' out/report.txt
          grep -q 'speedup-x' out/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
          if-no-files-found: ignore
