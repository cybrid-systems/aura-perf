name: ci
on: [push, pull_request]
jobs:
  baseline:
    name: pinned baseline
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - uses: actions/checkout@v4
      - name: Drift gate
        run: python3 scripts/check-baseline.py
      - name: Install the pinned Aura nightly
        run: echo "$(bash scripts/install-aura.sh)" >> "$GITHUB_PATH"
      - name: Prove the pinned binary
        run: aura --version

  smoke:
    runs-on: ubuntu-latest
    # #5397: the bus contract tests need the current Aura stdlib
    # (std/bus and bus:defines). The rolling `nightly` release is built
    # from core main by dist.yml; use its tarball instead of rebuilding
    # the compiler on every run.
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Aura nightly
        run: |
          bin="$(bash scripts/install-aura.sh)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "AURA_BIN=$bin/aura" >> "$GITHUB_ENV"
      - name: Install perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic linux-tools-common
          # Software events are enough when the host PMU is missing.
          # Lower paranoid when the runner allows it; otherwise the example
          # records why perf did not select a hotspot.
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          echo "perf candidates:"
          find /usr/lib/linux-tools /usr/bin /usr/libexec -name perf -type f 2>/dev/null || true
          if bin="$(sh scripts/find-perf.sh)"; then
            echo "PERF_BIN=$bin" >> "$GITHUB_ENV"
            "$bin" --version || true
            "$bin" stat -e task-clock,cycles,instructions,cache-misses -- true || true
          else
            echo "perf binary not usable on this kernel" | tee perf-unavailable.txt
          fi
      - name: Parser, query, proposer, gate, CCT, and exit-code tests
        run: ./run.sh test
      - name: Autotune the sum-scan target
        run: ./run.sh autotune
        env:
          AURA_EVO_LOG: ${{ github.workspace }}/out/evo.jsonl
      - name: Report has a keep, a rollback, and an intend result
        run: |
          grep -q 'verdict intend-met=' out/report.txt
          grep -q 'KEEP' out/report.txt
          grep -q 'ROLLBACK' out/report.txt
          grep -q 'intend-met' out/report.txt
      - name: Recheck the saved gate without reprofiling
        run: ./run.sh recheck
      - name: Machine inventory and a one-second layered check
        run: |
          ./run.sh sysinfo
          ./run.sh check
          grep -q 'sysinfo arch=' out/sysinfo.txt
          grep -q 'check seconds=' out/check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
          if-no-files-found: ignore
